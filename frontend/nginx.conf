server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend service (named "backend" on the compose
    # network). This mirrors the Vite dev proxy, so the app always calls a
    # relative "/api" with no hard-coded host.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
