spring.application.name=skypath-backend
server.port=8080

# Location of the flights dataset. Resolved via Spring's ResourceLoader, so it
# accepts file: and classpath: prefixes. Defaults to the repo-root flights.json
# relative to the backend working directory; overridable via SKYPATH_DATA_LOCATION
# (e.g. inside Docker) without touching source.
skypath.data.location=${SKYPATH_DATA_LOCATION:file:../flights.json}
